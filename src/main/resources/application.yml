spring:
  application:
    name: sri-lanka-news-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
    redis:
      url: ${REDIS_URL}

news:
  processing:
    redis:
      enabled: ${REDIS_PROCESSING_ENABLED:true}
      stream-key: article-discovered
      dead-letter-stream-key: article-discovered-dlq
      consumer-group: article-processing
      consumer-name: ${HOSTNAME:sri-lanka-news-backend}
      max-attempts: 3
      poll-timeout: 2s

ingestion:
  api-key: ${INGESTION_API_KEY}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    lk.srilankannews: INFO
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
