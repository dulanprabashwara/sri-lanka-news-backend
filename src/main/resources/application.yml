spring:
  application:
    name: sri-lanka-news-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
    redis:
      url: ${REDIS_URL}

news:
  rate-limit:
    semantic-search-per-minute: ${SEMANTIC_SEARCH_RATE_LIMIT_PER_MINUTE:20}
    ask-story-per-minute: ${ASK_STORY_RATE_LIMIT_PER_MINUTE:10}
    max-clients: ${PUBLIC_AI_RATE_LIMIT_MAX_CLIENTS:10000}

  admin:
    user-ids: ${ADMIN_USER_IDS:}

  search:
    semantic:
      vector-index: ${SEMANTIC_SEARCH_VECTOR_INDEX:idx_articles_semantic_vector}
      min-score: ${SEMANTIC_SEARCH_MIN_SCORE:0.65}
      max-window: ${SEMANTIC_SEARCH_MAX_WINDOW:200}

  for-you:
    candidate-limit: ${FOR_YOU_CANDIDATE_LIMIT:500}

  article:
    trending:
      lookback-window: ${TRENDING_ARTICLES_LOOKBACK:48h}
      half-life: ${TRENDING_ARTICLES_HALF_LIFE:8h}
      candidate-limit: ${TRENDING_ARTICLES_CANDIDATE_LIMIT:200}
      default-limit: ${TRENDING_ARTICLES_DEFAULT_LIMIT:20}
      max-limit: ${TRENDING_ARTICLES_MAX_LIMIT:50}
      max-per-story: ${TRENDING_ARTICLES_MAX_PER_STORY:2}
      max-per-source: ${TRENDING_ARTICLES_MAX_PER_SOURCE:3}
      cache-ttl: ${TRENDING_ARTICLES_CACHE_TTL:90s}

  ai:
    enrichment:
      retry:
        enabled: ${ENRICHMENT_RETRY_ENABLED:true}
        batch-size: ${ENRICHMENT_RETRY_BATCH_SIZE:5}
        max-attempts: ${ENRICHMENT_RETRY_MAX_ATTEMPTS:5}
        initial-backoff: ${ENRICHMENT_RETRY_INITIAL_BACKOFF:5m}
        max-backoff: ${ENRICHMENT_RETRY_MAX_BACKOFF:6h}
        lease-duration: ${ENRICHMENT_RETRY_LEASE_DURATION:2m}
        poll-interval: ${ENRICHMENT_RETRY_POLL_INTERVAL:60s}

    gemini:
      api-key: ${GEMINI_API_KEY}
      model: ${GEMINI_MODEL}
      prompt-version: v1
      timeout: 30s
      max-input-characters: ${GEMINI_MAX_INPUT_CHARACTERS:30000}
      background:
        max-concurrency: ${GEMINI_BACKGROUND_MAX_CONCURRENCY:1}
        minimum-spacing: ${GEMINI_BACKGROUND_MINIMUM_SPACING:2s}
        rate-limit-cooldown: ${GEMINI_RATE_LIMIT_COOLDOWN:60s}

    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
      model: ${OPENROUTER_MODEL:openrouter/free}
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      timeout: ${OPENROUTER_TIMEOUT:30s}

    multilingual:
      model: ${MULTILINGUAL_MODEL:${GEMINI_MODEL}}
      prompt-version: ${MULTILINGUAL_PROMPT_VERSION:translation-v1}
      max-input-characters: ${MULTILINGUAL_MAX_INPUT_CHARACTERS:8000}
      backfill-limit: ${MULTILINGUAL_BACKFILL_LIMIT:0}

      reliability:
        gemini-max-attempts: ${TRANSLATION_GEMINI_MAX_ATTEMPTS:1}
        initial-backoff: ${TRANSLATION_RETRY_INITIAL_BACKOFF:250ms}

      azure:
        key: ${AZURE_TRANSLATOR_KEY:}
        endpoint: ${AZURE_TRANSLATOR_ENDPOINT:https://api.cognitive.microsofttranslator.com}
        region: ${AZURE_TRANSLATOR_REGION:}
        timeout: ${AZURE_TRANSLATOR_TIMEOUT:15s}
        max-input-characters: ${AZURE_TRANSLATOR_MAX_INPUT_CHARACTERS:8000}

  cache:
    article-feed:
      enabled: true
      ttl: ${ARTICLE_FEED_CACHE_TTL_SECONDS:60}s

  story:
    trending:
      window-hours: ${TRENDING_WINDOW_HOURS:72}
      recency-half-life-hours: ${TRENDING_RECENCY_HALF_LIFE_HOURS:12}
      source-normalization: ${TRENDING_SOURCE_NORMALIZATION:3}
      report-normalization: ${TRENDING_REPORT_NORMALIZATION:5}
      max-candidates: ${TRENDING_MAX_CANDIDATES:500}

    ask:
      prompt-version: ${ASK_STORY_PROMPT_VERSION:ask-story-v1}
      max-question-characters: ${ASK_STORY_MAX_QUESTION_CHARACTERS:500}
      max-retrieved-articles: ${ASK_STORY_MAX_RETRIEVED_ARTICLES:5}
      max-article-context-characters: ${ASK_STORY_MAX_ARTICLE_CONTEXT_CHARACTERS:6000}
      max-total-context-characters: ${ASK_STORY_MAX_TOTAL_CONTEXT_CHARACTERS:24000}
      max-answer-characters: ${ASK_STORY_MAX_ANSWER_CHARACTERS:3000}

    clustering:
      window: ${STORY_CLUSTER_WINDOW_HOURS:48}h
      threshold: ${STORY_CLUSTER_THRESHOLD:0.72}
      candidate-limit: ${STORY_CLUSTER_CANDIDATE_LIMIT:200}
      backfill-limit: ${STORY_CLUSTER_BACKFILL_LIMIT:100}

    embedding:
      model: ${STORY_EMBEDDING_MODEL:gemini-embedding-2}
      dimensions: ${STORY_EMBEDDING_DIMENSIONS:768}
      input-version: story-semantic-v2
      max-input-characters: ${STORY_EMBEDDING_MAX_INPUT_CHARACTERS:8000}
      semantic-threshold: ${STORY_SEMANTIC_THRESHOLD:0.82}
      cross-language-semantic-threshold: ${STORY_CROSS_LANGUAGE_SEMANTIC_THRESHOLD:0.90}
      backfill-limit: ${STORY_EMBEDDING_BACKFILL_LIMIT:50}

  processing:
    redis:
      enabled: ${REDIS_PROCESSING_ENABLED:true}
      stream-key: article-discovered
      dead-letter-stream-key: article-discovered-dlq
      consumer-group: article-processing
      consumer-name: ${HOSTNAME:sri-lanka-news-backend}
      max-attempts: 3
      poll-timeout: 2s
      supervise-interval: ${REDIS_SUPERVISE_INTERVAL:30s}
    pending-recovery:
      enabled: ${PENDING_RECOVERY_ENABLED:true}
      fixed-delay: ${PENDING_RECOVERY_INTERVAL:5m}
      stale-after: ${PENDING_RECOVERY_STALE_AFTER:5m}
      batch-size: ${PENDING_RECOVERY_BATCH_SIZE:50}

ingestion:
  api-key: ${INGESTION_API_KEY}

supabase:
  auth:
    issuer: ${SUPABASE_AUTH_ISSUER:http://localhost.invalid/auth/v1}
    jwks-uri: ${SUPABASE_AUTH_JWKS_URI:http://localhost.invalid/auth/v1/.well-known/jwks.json}
    audience: ${SUPABASE_AUTH_AUDIENCE:authenticated}

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    lk.srilankannews: INFO

  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
